# The Discord Activity's server on Fly.io. See docs/DISCORD.md.
app = "study-squad"
primary_region = "iad"

# The Application ID build arg comes from the DISCORD_CLIENT_ID repository
# variable in CI (see the "Deploy Discord" job in .github/workflows/ci.yml).

[http_service]
  internal_port = 8080
  force_https = true
  # Timers, recaps and session reminders run on the server, so it never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Each Discord server's database, settings and jobs.
[mounts]
  source = "study_squad_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
