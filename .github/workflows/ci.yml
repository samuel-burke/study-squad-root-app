name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate networking code from Protobuf
        run: npm run generate
      - name: Check generated package versions are committed
        run: git diff --exit-code package-lock.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:coverage
      - run: npm run build
      - name: Build the website
        run: node scripts/build-site.mjs _site
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Microsoft's Playwright image has Chromium and its system libraries
    # preinstalled, so the job never waits on Ubuntu's apt mirrors. Keep the
    # tag in step with @playwright/test in client/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run test:e2e
      # The real server, database and RootGateway, on the fake Root host
      # (fake-root/), with several members open at once. See docs/TESTING.md.
      - name: Full-stack e2e on the fake Root host
        run: npm run test:e2e:root
      # The Discord Activity: the Discord host, server and client on a fake Discord API.
      - name: Discord Activity e2e
        run: npm run test:e2e:discord
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/playwright-report-root/
            client/playwright-report-discord/
          retention-days: 14

  package:
    name: Package boots like on Root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same clean build the deploy job uploads.
      - name: Build
        run: |
          rm -rf networking/gen
          npm run generate
          npm run build
      - name: Package
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .
      # Checks the networking versions inside the package and starts its server
      # against the fake Root host (fake-root/). See docs/TESTING.md.
      - name: Smoke check the package
        run: npm run smoke:package

  deploy:
    name: Deploy to Root
    needs: [verify, e2e, package]
    # Only main ships. Run it again by hand from the Actions tab if an upload failed.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-root
      cancel-in-progress: false
    permissions:
      contents: write # pushes the root-v<version> tag and its GitHub release after an upload
    env:
      ROOT_AUTH_TOKEN: ${{ secrets.ROOT_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Decide whether to upload
        id: check
        run: |
          version=$(node -p "require('./root-manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$ROOT_AUTH_TOKEN" ]; then
            echo "::notice::No ROOT_AUTH_TOKEN secret, so nothing is uploaded. See docs/DEPLOYING.md."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/root-v$version" >/dev/null; then
            echo "::notice::Version $version is already on Root. Bump the version in root-manifest.json to ship a new one."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.upload == 'true'
        run: npm ci
      - name: Build
        if: steps.check.outputs.upload == 'true'
        # Optional: bakes the feedback destination into the package (see docs/DEPLOYING.md).
        env:
          FEEDBACK_RELAY_URL: ${{ secrets.FEEDBACK_RELAY_URL }}
          FEEDBACK_RELAY_KEY: ${{ secrets.FEEDBACK_RELAY_KEY }}
          # Optional: who may open the self-test panel (see docs/TESTING.md).
          SELF_TEST_USER_IDS: ${{ secrets.SELF_TEST_USER_IDS }}
        # A clean generate: stale networking/gen output once crashed the app on Root.
        run: |
          rm -rf networking/gen
          npm run generate
          npm run build
      - name: Package
        if: steps.check.outputs.upload == 'true'
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .
      - name: Smoke check the package
        if: steps.check.outputs.upload == 'true'
        run: npm run smoke:package
      - name: Upload to Root
        if: steps.check.outputs.upload == 'true'
        run: npx rootsdk upload package --file ./rootapp.pkg --authToken "$ROOT_AUTH_TOKEN"
      - name: Tag the uploaded version
        if: steps.check.outputs.upload == 'true'
        run: |
          git tag "root-v${{ steps.check.outputs.version }}"
          git push origin "root-v${{ steps.check.outputs.version }}"
      - name: Publish the GitHub release
        if: steps.check.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        # The notes are this version's section of CHANGELOG.md.
        run: |
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { found = 1; next } /^## \[/ && found { exit } found' CHANGELOG.md > notes.md
          gh release create "root-v$VERSION" --title "v$VERSION" --notes-file notes.md --latest

  deploy-discord:
    name: Deploy Discord Activity
    needs: [verify, e2e]
    # Only main ships, like the Root deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # The host is a Graviton (arm64) box, so the image is built on arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: deploy-discord
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
    steps:
      - name: Decide whether to deploy
        id: check
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$DISCORD_CLIENT_ID" ]; then
            echo "::notice::The AWS_DEPLOY_ROLE_ARN and DISCORD_CLIENT_ID variables aren't both set, so the Discord Activity isn't deployed. See docs/INFRA.md."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: steps.check.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.check.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        if: steps.check.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/study-squad:${{ github.sha }}
          build-args: VITE_DISCORD_CLIENT_ID=${{ env.DISCORD_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it on the host
        if: steps.check.outputs.deploy == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/study-squad:${{ github.sha }}
        # SSM Run Command: no SSH port is open. The script health-checks the
        # new image and rolls back if it fails (infra/host/deploy.sh.tftpl).
        run: |
          instance=$(aws ec2 describe-instances --query 'Reservations[].Instances[].InstanceId' --output text \
            --filters Name=tag:App,Values=study-squad Name=instance-state-name,Values=running)
          id=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment "deploy $GITHUB_SHA" \
            --parameters "commands=[\"/usr/local/bin/study-squad-deploy $IMAGE\"]" \
            --query Command.CommandId --output text)
          for _ in $(seq 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          [ "$status" = "Success" ]
