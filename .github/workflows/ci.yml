name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate networking code from Protobuf
        run: npm run generate
      - name: Check generated package versions are committed
        run: git diff --exit-code package-lock.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to Root
    needs: [verify, e2e]
    # Only main ships. Run it again by hand from the Actions tab if an upload failed.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-root
      cancel-in-progress: false
    permissions:
      contents: write # pushes the root-v<version> tag after an upload
    env:
      ROOT_AUTH_TOKEN: ${{ secrets.ROOT_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Decide whether to upload
        id: check
        run: |
          version=$(node -p "require('./root-manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$ROOT_AUTH_TOKEN" ]; then
            echo "::notice::No ROOT_AUTH_TOKEN secret, so nothing is uploaded. See docs/DEPLOYING.md."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/root-v$version" >/dev/null; then
            echo "::notice::Version $version is already on Root. Bump the version in root-manifest.json to ship a new one."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.upload == 'true'
        run: npm ci
      - name: Build
        if: steps.check.outputs.upload == 'true'
        # A clean generate: stale networking/gen output once crashed the app on Root.
        run: |
          rm -rf networking/gen
          npm run generate
          npm run build
      - name: Package
        if: steps.check.outputs.upload == 'true'
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .
      - name: Upload to Root
        if: steps.check.outputs.upload == 'true'
        run: npx rootsdk upload package --file ./rootapp.pkg --authToken "$ROOT_AUTH_TOKEN"
      - name: Tag the uploaded version
        if: steps.check.outputs.upload == 'true'
        run: |
          git tag "root-v${{ steps.check.outputs.version }}"
          git push origin "root-v${{ steps.check.outputs.version }}"
